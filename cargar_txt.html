<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cargar TXT - Cyborg Dragon</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: #e8f5e9;
      }
      .container {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 2rem;
        margin-top: 3rem;
        max-width: 600px;
      }
      .form-label {
        color: #388e3c;
      }
      .btn-success {
        background-color: #388e3c;
        border: none;
      }
      #drop-area {
        cursor: pointer;
        transition: border-color 0.2s;
      }
      #drop-area.dragover {
        border-color: #388e3c;
        background: #c8e6c9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="mb-4 text-success">Carga tu lista de beneficiarios</h2>
      <form>
        <div class="mb-3">
          <label for="cuentaSelect" class="form-label"
            >Selecciona una cuenta</label
          >
          <select class="form-select" id="cuentaSelect">
            <option value="ens_soles">Cuenta ENS - Soles</option>
            <option value="ens_dolares">Cuenta ENS - Dólares</option>
          </select>
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-center">
            <div
              id="drop-area"
              class="w-100 p-5 border border-success rounded-3 bg-light"
              style="
                min-height: 220px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
              "
            >
              <div class="text-center">
                <p class="fs-5 text-success mb-2">
                  Arrastra y suelta aquí tu archivo o
                </p>
                <label for="txtFile" class="btn btn-outline-success"
                  >Búscalo en tu equipo</label
                >
                <input
                  class="form-control d-none"
                  type="file"
                  id="txtFile"
                  accept=".txt"
                  multiple
                />
              </div>
            </div>
          </div>
        </div>
        <button type="submit" class="btn btn-success">Cargar TXT</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
